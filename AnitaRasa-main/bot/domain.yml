  - producto
  - image_data
  - mensaje_recordatorio
  - fecha_recordatorio
  - numero
  - pais

slots:
  producto:
    type: text
    mappings:
    - type: from_entity
      entity: producto
    
  pais:
    type: text
    initial_value: "MX"
    mappings:
    - type: from_entity
      entity: pais
      
  ultimo_producto_cotizado:
    type: text
    mappings:
    - type: custom
  consulta_negocio:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: null

  company_urls:
    type: list
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: company_urls
        conditions:
          - active_loop: null

  image_data:
    type: text  
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: image_data
        conditions:
          - active_loop: null 

  mensaje_recordatorio:
    type: text
    mappings:
      - type: from_entity
        entity: mensaje_recordatorio
        intent: set_reminder
        conditions:
          - active_loop: null
        
  fecha_recordatorio:
    type: text
    mappings:
      - type: from_entity
        entity: fecha_recordatorio
        intent: set_reminder
        conditions:
          - active_loop: null

  nombre_marca:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: formulario_evaluacion_marca
            requested_slot: nombre_marca

  tipo_empresa:
    type: categorical
    values:
      - ecommerce
      - servicios
      - otro
    mappings:
      - type: from_text
        conditions:
          - active_loop: formulario_evaluacion_marca
            requested_slot: tipo_empresa

  q1:
