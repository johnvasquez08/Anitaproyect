# The config recipe.
# https://rasa.com/docs/rasa/model-configuration/
recipe: default.v1

# The assistant project unique identifier
assistant_id: 20250919-133403-isothermal-compressor

# Configuration for Rasa NLU.
language: es

# Configuration for Rasa Core policies.
policies:
  - name: MemoizationPolicy
    max_history: 5
  - name: RulePolicy
    core_fallback_action_name: "action_search_google"
    core_fallback_threshold: 0.3
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 50
  - name: TEDPolicy
    max_history: 5
    epochs: 50
    constrain_similarities: true

# Pipeline optimizado para español con mejor extracción de entidades
pipeline:
  # Tokenización
  - name: WhitespaceTokenizer
  
  # Características léxicas y sintácticas
  - name: LexicalSyntacticFeaturizer
  
  # Vectorización de palabras (bag of words)
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 2
  
  # Vectorización de caracteres
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 2
    max_ngram: 4
  
  # DIET Classifier - Motor principal para intents y entidades
  - name: DIETClassifier
    epochs: 100  # Aumentado para mejor aprendizaje
    constrain_similarities: true
    number_of_transformer_layers: 2
    use_masked_language_model: true
    entity_recognition: true
    # Configuración optimizada
    transformer_size: 256
    batch_size: [64, 256]
    eval_num_epochs: 20
    learning_rate: 0.001
  
  
  # Mapeo de sinónimos
  - name: EntitySynonymMapper
  
  # Selector de respuestas
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true
# <--- CAMBIA ESTO A 1 O MÁS
    use_masked_language_model: false
    retrieval_intent: "faq"
  
  # Clasificador de fallback
  - name: FallbackClassifier
    threshold: 0.4  # Ligeramente aumentado para mayor precisión
    ambiguity_threshold: 0.1

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true